name: Surf weekoverzicht

on:
  schedule:
    - cron: "0 7 * * 0"   # zondag 08:00/09:00 NL-tijd (UTC)
  workflow_dispatch:

jobs:
  week:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python surf_alert.py --weekly
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
